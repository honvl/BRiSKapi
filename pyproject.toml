[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "briskapi"
version = "1.10.0"
description = "Unofficial Python API and brisk CLI for BRiSK auction data: sign in to your broker's BRiSK (SBI, Tachibana e-shiten, Matsui, Monex, SMBC Nikko) with a passkey, record the live feed through BRiSK's own decoder day after day, keep each day in your own private archive, and query your history and OHLCV bars through the cloud API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["numpy>=1.26", "pyarrow>=19"]
keywords = ["brisk", "market-data", "auction", "tokyo-stock-exchange", "japan", "sbi", "tachibana", "e-shiten", "matsui", "monex", "smbc-nikko"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[project.urls]
Source = "https://github.com/honvl/BRiSKapi"
Issues = "https://github.com/honvl/BRiSKapi/issues"
Releases = "https://github.com/honvl/BRiSKapi/releases"
Privacy = "https://github.com/honvl/BRiSKapi/blob/main/PRIVACY.md"

[project.scripts]
brisk = "briskapi.cli:main"

# Self-contained: the archive settings, reference fingerprints, Node decoder
# hosts and asset pins ship inside the package. Vendor assets never do.
[tool.setuptools]
packages = ["briskapi"]

[tool.setuptools.package-data]
briskapi = ["archive.json", "references/*.json", "decoder/*.cjs", "decoder/assets.json", "LICENSE-pybrisk.txt"]
