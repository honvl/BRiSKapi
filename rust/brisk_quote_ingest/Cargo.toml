[package]
name = "brisk_quote_ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Historical BRiSK auction state and recording validator"
repository = "https://github.com/honvl/briskapi"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "process", "rt", "io-util", "signal", "time"] }
